# env variables exposed to the Linx Portal
env:
  - name: PORT
    default: "3000"

  # Postgres connectivity test (set DATABASE_URL, or the discrete PG* vars)
  - name: DATABASE_URL
  - name: PGHOST
  - name: PGPORT
    default: "5432"
  - name: PGUSER
  - name: PGPASSWORD
  - name: PGDATABASE
  - name: PGSSL
    default: "false"

  # MSSQL connectivity test (set MSSQL_CONNECTION_STRING, or the discrete MSSQL_* vars)
  - name: MSSQL_CONNECTION_STRING
  - name: MSSQL_HOST
  - name: MSSQL_PORT
    default: "1433"
  - name: MSSQL_USER
  - name: MSSQL_PASSWORD
  - name: MSSQL_DATABASE
  - name: MSSQL_ENCRYPT
    default: "true"
  - name: MSSQL_TRUST_SERVER_CERTIFICATE
    default: "true"

  # S3 connectivity test
  - name: AWS_REGION
  - name: AWS_ACCESS_KEY_ID
  - name: AWS_SECRET_ACCESS_KEY
  - name: S3_BUCKET
  - name: S3_ENDPOINT

  # Disk connectivity test  
  - name: DISK_PATH

  # Observability
  - name: LOG_LEVEL
    default: "info"
  - name: LOG_SQL
    default: "false"
  - name: OTEL_SERVICE_NAME
    default: "portal-test-express"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
  - name: OTEL_SDK_DISABLED
    default: "false"

# Linx Portal configuration for the application
port:
  default: 3000
  linked_env_var: PORT

test:
  image: node:22
  command: |
    npm ci
    npm run test
    # Point the integration tier at the sidecar services below. Real env vars
    # take precedence over --env-file, so .env.test's local-only ports (which
    # exist to avoid clashing with a developer's own services) don't apply here.
    export S3_ENDPOINT=http://localhost:9000
    export AWS_REGION=us-east-1
    export AWS_ACCESS_KEY_ID=portaltest
    export AWS_SECRET_ACCESS_KEY=portaltest
    export S3_BUCKET=portal-test
    export DISK_PATH=/mnt/data
    # MinIO accepts connections before it can serve S3, and the integration
    # tier skips (never fails) on an unreachable service — so wait for it or
    # the object storage tests quietly vanish.
    until curl -sf http://localhost:9000/minio/health/live >/dev/null; do sleep 1; done
    npm run test:integration
  services:
    - image: postgres:16-alpine
      env:
        POSTGRES_USER: portal
        POSTGRES_PASSWORD: portal_test
        POSTGRES_DB: portal_test
    - image: mcr.microsoft.com/mssql/server:2022-latest
      env:
        ACCEPT_EULA: "Y"
        MSSQL_SA_PASSWORD: "Portal_Test1!"
        MSSQL_PID: Developer
    # Object storage under test — same image and throwaway credentials as
    # docker-compose.test.yml. The suite creates S3_BUCKET itself.
    - image: minio/minio
      args: server /data --address :9000
      env:
        MINIO_ROOT_USER: portaltest
        MINIO_ROOT_PASSWORD: portaltest
  # Mounted volume the disk tests exercise, addressed by DISK_PATH above.
  disks:
    - /mnt/data
