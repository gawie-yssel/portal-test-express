# Backing services for the opt-in integration tier:
#
#   docker compose -f docker-compose.test.yml up -d
#   npm run test:integration
#   docker compose -f docker-compose.test.yml down -v
#
# Ports are deliberately non-default so a local Postgres/SQL Server/MinIO
# keeps working while these run. Credentials match .env.test and are
# throwaway — these containers are for tests only.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal_test
      POSTGRES_DB: portal_test
    ports:
      - '54329:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U portal -d portal_test']
      interval: 5s
      timeout: 5s
      retries: 20

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'Portal_Test1!'
      MSSQL_PID: Developer
    ports:
      - '14339:1433'

  minio:
    image: minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: portaltest
      MINIO_ROOT_PASSWORD: portaltest
    ports:
      - '9009:9000'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20
